name: Dependency advisory scan
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit==2.9.0
      - run: sed 's/+cpu$//' constraints-cpu.txt > /tmp/advisory-input.txt
      - run: python -m pip_audit --no-deps --disable-pip -r /tmp/advisory-input.txt
